<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Beatles</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: lightgray;
    }
    .albums {
      max-width: 300px;
    }
  </style>
</head>
<body class="container py-5">

  <!-- Heading -->
  <h2 class="text-center text-danger mb-4">The Beatles</h2>

  <!-- Beatles image -->
  <div class="text-center mb-3">
    <img src="https://upload.wikimedia.org/wikipedia/en/0/0d/TheBeatlesBBCVol2.jpg" 
         alt="The Beatles Album" class="img-fluid rounded shadow">
  </div>

  <!-- Link to official website -->
  <p class="text-center">
    <a href="https://www.thebeatles.com/" class="link-primary">
      This is a link to the official Beatles Website
    </a>
  </p>

  <!-- Albums list -->
  <div class="albums mt-4">
    <h5>Albums</h5>
    <ul class="list-unstyled ms-3">
      <li>With The Beatles</li>
      <li>Let It Be</li>
      <li>Yellow Submarine</li>
      <li>Revolver</li>
      <li>Sgt Pepper</li>
      <li>Abbey Road</li>
    </ul>
  </div>

  <!-- Footer -->
  <footer class="text-center mt-5">
    <p>Created 9-5-14</p>
    <p>by <a href="mailto:josephyun@example.com" class="link-dark">Joseph Yun</a></p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
