<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Media Example</title>
</head>
<body>

  <h2>Image Example</h2>
  <!-- Adding an image -->
  <img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="Beautiful House" width="400">




  <h2>Video Example</h2>
<!-- Local video file -->
<video width="500" controls>
  <source src="video.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>




<h2>YouTube Video Example</h2>
<!-- Embedding YouTube video using iframe -->
<iframe width="560" height="315" 
  src="https://www.youtube.com/embed/tgbNymZ7vqY" 
  title="YouTube video player" 
  frameborder="0" 
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
  allowfullscreen>
</iframe>





<h2>Content Blocks</h2>
<div style="border:2px solid black; padding:20px; margin:10px; width:300px;">
  <h3>Block Title</h3>
  <p>This is a content block. You can add text, images, or videos here.</p>
  <img src="https://www.w3schools.com/html/img_girl.jpg" width="200">
</div>

</body>
</html>
