<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Task</title>
  <style>
    body {
      margin: 0;
      background: #111;
      font-family: Arial, sans-serif;
      color: #333;
    }

    /* ---------- First Layout ---------- */
    .header {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 250px;
      background: white;
      border-bottom: 2px solid #ccc;
    }
    .header h3 {
      position: absolute;
      top: 10px;
      left: 20px;
      font-size: 14px;
    }
    .header .left {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 20px;
    }
    .header .left img {
      height: 100%;
      object-fit: cover;
    }
    .header .right {
      width: 200px;
      background: #00bfff;
    }

    /* ---------- Grid Layout ---------- */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
      padding: 30px;
      background: white;
      margin: 20px auto;
      max-width: 1000px;
    }
    .grid-container div {
      background: gray;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- First Layout -->
  <div class="header">
    <h3>Chris Tomlin</h3>
    <div class="left">
      <img src="https://i.ibb.co/WtqFd7c/chris.png" alt="Chris">
    </div>
    <div class="right"></div>
  </div>

  <!-- Grid Layout -->
  <div class="grid-container">
    <div><img src="https://picsum.photos/200?random=1" alt=""></div>
    <div><img src="https://picsum.photos/200?random=2" alt=""></div>
    <div><img src="https://picsum.photos/200?random=3" alt=""></div>
    <div><img src="https://picsum.photos/200?random=4" alt=""></div>
    <div><img src="https://picsum.photos/200?random=5" alt=""></div>
    <div><img src="https://picsum.photos/200?random=6" alt=""></div>
    <div><img src="https://picsum.photos/200?random=7" alt=""></div>
    <div><img src="https://picsum.photos/200?random=8" alt=""></div>
  </div>

</body>
</html>
