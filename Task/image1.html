<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 1 - HTML5 Basics with Bootstrap</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #9c9; /* same greenish background */
    }
    .trebuchet {
      font-family: "Trebuchet MS", sans-serif;
    }
    .big-text {
      font-size: 40px;
    }
    .small-white {
      font-size: 12px;
      color: white;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body class="container py-4">

  <!-- Left aligned -->
  <p class="text-start">This paragraph is left alighned.</p>

  <!-- Center aligned -->
  <p class="text-center">This paragraph is center aligned.</p>

  <!-- Right aligned -->
  <p class="text-end">This paragraph is right aligned.</p>

  <!-- Green text -->
  <p class="text-success">This text is Green.</p>

  <!-- Trebuchet font -->
  <p class="trebuchet">This is Trebuchet.</p>

  <!-- Big text -->
  <p class="big-text">This is big text.</p>

  <!-- Small white Arial text -->
  <p class="small-white">This text is white, arial, and small.</p>

  <!-- Link to school -->
  <p>This is a link to 
    <a href="https://www.d125.org/" class="link-primary">Stevenson High School</a>.
  </p>

  <!-- Email link -->
  <p>This is an email link to 
    <a href="mailto:mrssmith@example.com" class="link-primary">Mrs Smith</a>.
  </p>

  <!-- Image -->
  <div class="text-center mt-3">
    <img src="assignment_1.png" alt="Dog Image" class="img-fluid rounded">
  </div>

  <!-- Bootstrap JS (optional for components) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
