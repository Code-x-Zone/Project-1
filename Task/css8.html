<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Image Div</title>
  <style>
    /* --- Introduction & Syntax --- */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* --- Selector Example: class selector --- */
    .hero-section {
      background-image: url('https://picsum.photos/1200/600'); /* Background */
      background-size: cover;      /* Image covers full area */
      background-position: center; /* Center the image */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white; /* Colors */
      position: relative;
    }

    .hero-content {
      background: rgba(0, 0, 0, 0.5); /* Transparent overlay */
      padding: 30px;
      border-radius: 12px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    button {
      background: #74b9ff;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
      color: white;
    }

    button:hover {
      background: #0984e3;
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <div class="hero-content">
      <h1>Welcome to My Website</h1>
      <button>Get Started</button>
    </div>
  </div>
</body>
</html>
