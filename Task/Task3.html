<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    header {
      background: #f2f2f2;
      padding: 10px 20px;
    }
    nav {
      text-align: right; /* align links to right */
    }
    nav a {
      text-decoration: none;
      color: #333;
      margin-left: 15px;
      font-weight: bold;
    }
    nav a:hover {
      color: #007bff;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#HOME">Home</a>
      <a href="#ABOUT">About</a>
      <a href="#CONTACT">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Welcome to My Website</h1>
    <p>This is the main content area.</p>
  </main>

</body>
</html>
